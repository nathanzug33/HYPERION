<?xml version="1.0" encoding="UTF-8"?>
<!-- ================================================================
     HYPERION GROUP - fichier de travail vectoriel
     Canvas 1170 x 781 (memes coordonnees que le PNG d'origine)
     Chaque element est nomme (id) pour etre selectionne facilement.
     Police du wordmark : Poppins ExtraBold (gratuite, Google Fonts)
     -> a installer / activer dans ton outil avant ouverture.
     ================================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 781" width="1170" height="781">

  <defs>
    <!-- degrade de l'orbite : bleu fonce -> bleu clair -->
    <linearGradient id="degradeOrbite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2E4763"/>
      <stop offset="55%"  stop-color="#6387AD"/>
      <stop offset="100%" stop-color="#9DC0EC"/>
    </linearGradient>
    <!-- degrade du trait fin : navy -> bleu -> transparent -->
    <linearGradient id="degradeTrait" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#222D3C"/>
      <stop offset="70%"  stop-color="#6387AD"/>
      <stop offset="100%" stop-color="#6387AD" stop-opacity="0"/>
    </linearGradient>
    <!-- halo lumineux du point soleil -->
    <radialGradient id="halo">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- FOND : supprime-le pour un logo transparent -->
  <rect id="fond" x="0" y="0" width="1170" height="781" fill="#FFFFFF"/>

  <!-- ORBITE : cercle complet. Le texte passe par-dessus et cree
       naturellement les interruptions, comme sur le logo d'origine. -->
  <circle id="orbite" cx="796" cy="377" r="226"
          fill="none" stroke="url(#degradeOrbite)" stroke-width="22"/>

  <!-- POINT SOLEIL + son halo -->
  <circle id="halo-soleil" cx="695" cy="211" r="62" fill="url(#halo)"/>
  <circle id="soleil"      cx="695" cy="211" r="16" fill="#222D3C"/>

  <!-- TRAIT FIN sous le wordmark -->
  <line id="trait" x1="128" y1="455" x2="545" y2="455"
        stroke="url(#degradeTrait)" stroke-width="6" stroke-linecap="round"/>

  <!-- WORDMARK : vrai texte, donc entierement modifiable.
       Ligne de base "Hyperion" = y 360  |  "Group" = y 465 -->
  <g id="wordmark" font-family="Poppins, 'Sora', 'Space Grotesk', sans-serif"
     font-weight="800" fill="#222D3C">
    <text id="mot-hyperion" x="127" y="360" font-size="222" letter-spacing="-9">Hyperion</text>
    <text id="mot-group"    x="523" y="465" font-size="222" letter-spacing="-9">Group</text>
  </g>

  <!-- SIGNATURE -->
  <g id="signature" font-family="Inter, Montserrat, sans-serif"
     font-size="30" letter-spacing="7" fill="#60636B">
    <text x="135" y="510">ENGINEERING</text>
    <text x="135" y="543">ILLUMINATED</text>
  </g>

</svg>
